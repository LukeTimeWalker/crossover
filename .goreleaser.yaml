---
version: 2
before:
  hooks:
    - go mod tidy
builds:
  - main: ./cmd/crossover/main.go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    binary: crossover
archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{- if eq .Arch "amd64" }}x86_64{{- else }}{{ .Arch }}{{ end }}{{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^test\\("
      - "merge conflict"
      - "Merge pull request"
      - "Merge remote-tracking branch"
      - "Merge branch"
  groups:
    - title: "New Features"
      regexp: "^.*?feat(\\(.+\\))??!?:.+$"
      order: 100
    - title: "Bug fixes"
      regexp: "^.*?(fix|refactor)(\\(.+\\))??!?:.+$"
      order: 200
    - title: Dependency updates
      regexp: "^.*?(.+)\\(deps\\)!?:.+$"
      order: 300
    - title: Other work
      order: 9999
dockers_v2:
  - images:
      - ghcr.io/luketimewalker/{{ .ProjectName }}
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    flags:
      - --pull
      - --provenance=false
      - --sbom=false
    annotations:
      org.opencontainers.image.name: "{{.ProjectName}}"
      org.opencontainers.image.description: "Lightweight, declarative webhook translator written in Go"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: "{{.GitURL}}"
      org.opencontainers.image.base.name: "{{.BaseImage}}"
      org.opencontainers.image.base.digest: "{{.BaseImageDigest}}"
release:
  name_template: "v{{ .Version }}"
  header: |-
    ![Crossover Logo](./assets/header.svg)
