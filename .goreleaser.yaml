version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/crossover/main.go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{ .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^test\\("
      - "merge conflict"
      - "Merge pull request"
      - "Merge remote-tracking branch"
      - "Merge branch"
  groups:
    - title: "New Features"
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 100
    - title: "Bug fixes"
      regexp: '^.*?(fix|refactor)(\(.+\))??!?:.+$'
      order: 200
    - title: Dependency updates
      regexp: '^.*?(.+)\(deps\)!?:.+$'
      order: 300
    - title: Other work
      order: 9999

dockers:
  - image_templates:
      - "luketimewalker/crossover:{{ .Tag }}-linux-amd64"
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--platform=linux/amd64"
    goos: linux
    goarch: amd64
  - image_templates:
      - "luketimewalker/crossover:{{ .Tag }}-linux-arm64"
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--platform=linux/arm64"
    goos: linux
    goarch: arm64
  - image_templates:
      - "luketimewalker/crossover:{{ .Tag }}-darwin-amd64"
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--platform=darwin/amd64"
    goos: darwin
    goarch: amd64
  - image_templates:
      - "luketimewalker/crossover:{{ .Tag }}-darwin-arm64"
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--platform=darwin/arm64"
    goos: darwin
    goarch: arm64
  - image_templates:
      - "luketimewalker/crossover:{{ .Tag }}-windows-amd64"
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--platform=windows/amd64"
    goos: windows
    goarch: amd64
  - image_templates:
      - "luketimewalker/crossover:{{ .Tag }}-windows-arm64"
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--platform=windows/arm64"
    goos: windows
    goarch: arm64
docker_manifests:
  - name_template: "luketimewalker/crossover:{{ .Tag }}"
    image_templates:
      - "luketimewalker/crossover:{{ .Tag }}-linux-amd64"
      - "luketimewalker/crossover:{{ .Tag }}-linux-arm64"
      - "luketimewalker/crossover:{{ .Tag }}-darwin-amd64"
      - "luketimewalker/crossover:{{ .Tag }}-darwin-arm64"
      - "luketimewalker/crossover:{{ .Tag }}-windows-amd64"
      - "luketimewalker/crossover:{{ .Tag }}-windows-arm64"

release:
  name_template: "v{{ .Version }}"
  header: |
    <img src="https://raw.githubusercontent.com/LukeTimeWalker/crossover/refs/heads/main/assets/header.svg" with="100%" alt="Crossover logo">
