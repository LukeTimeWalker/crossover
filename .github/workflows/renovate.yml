name: Renovate

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  renovate:
    name: Renovate
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Print current user
        run: whoami
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v39.0.0
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          configurationFile: ./renovate.json
