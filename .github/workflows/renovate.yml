name: Renovate
on:
  schedule:
    - cron: '0 0 * * *'
jobs:
  renovate:
    name: Renovate
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v40.2.5
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}