---
name: Renovate
on:
  workflow_dispatch:
jobs:
  renovate:
    name: Renovate
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.1.19
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          configurationFile: ./.github/renovate.global.json
